<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device firmware update</title>
<style>
:root{font:16px system-ui,sans-serif;color:#172b3a;background:#f0f4f7;color-scheme:light}body{margin:0;padding:48px 20px}main{max-width:520px;margin:auto;background:white;padding:32px;border:1px solid #d9e2e8;border-radius:18px;box-shadow:0 12px 40px #183b5610}small{color:#536c7c}h1{font-size:28px;margin:12px 0}p{line-height:1.6}label{display:block;font-weight:600;margin:24px 0 12px}input{box-sizing:border-box;width:100%;padding:16px;border:1px dashed #9db0bc;border-radius:10px}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:9px;background:#086a64;color:white;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.5;cursor:default}progress{width:100%;height:14px;margin-top:24px;accent-color:#086a64}#status{min-height:3em;overflow-wrap:anywhere}.error{color:#ae2231}.success{color:#086a64}footer{margin-top:24px;color:#536c7c;font-size:13px}
</style>
</head>
<body><main>
<small>LOCAL DEVICE MANAGEMENT</small><h1>Over The AirFirmware update</h1>
<p id="device">Connecting to your device…</p>
<p>Select an application <strong>.bin</strong> built for this Device. Keep the device powered and stay connected until verification finishes.</p>
<form id="form"><label for="firmware">Choose firmware</label><input id="firmware" type="file" accept=".bin" required><button id="upload" disabled>Upload firmware</button></form>
<progress id="progress" value="0" max="100" aria-label="Firmware upload progress"></progress>
<p id="status" role="status" aria-live="polite">Loading device information…</p>
<footer>Hosted on your device. No internet connection required.</footer>
</main>
<script>
const file=document.getElementById('firmware'),button=document.getElementById('upload'),status=document.getElementById('status'),progress=document.getElementById('progress');
let maximum=0,busy=false;
function message(text,kind=''){status.textContent=text;status.className=kind;}
function selected(){button.disabled=busy||!maximum||!file.files.length;}
file.addEventListener('change',selected);
fetch('/api/info',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to read device information.');return r.json();}).then(info=>{
 document.getElementById('device').textContent=info.project+' · version '+info.version;
 maximum=info.reboot_pending?0:info.max_size;selected();
 message(info.reboot_pending?'Restart pending. Reconnect and reload this page.':'Ready. Maximum firmware size: '+Math.floor(maximum/1024)+' KiB.');
}).catch(e=>message(e.message+' Reload the page to retry.','error'));
document.getElementById('form').addEventListener('submit',e=>{
 e.preventDefault();if(busy)return;const image=file.files[0];if(!image)return;
 if(!image.name.toLowerCase().endsWith('.bin')||!image.size||image.size>maximum){message('Choose a nonempty .bin within the maximum firmware size.','error');return;}
 busy=true;file.disabled=true;selected();progress.value=0;message('Uploading firmware…');
 const request=new XMLHttpRequest();request.open('POST','/api/update');request.setRequestHeader('Content-Type','application/octet-stream');request.timeout=210000;
 request.upload.onprogress=e=>{if(e.lengthComputable){progress.value=100*e.loaded/e.total;if(e.loaded===e.total)message('Upload sent. Verifying firmware on the device…');}};
 function retry(text){busy=false;file.disabled=false;selected();message(text,'error');}
 request.onload=()=>{if(request.status===202){progress.value=100;message(request.responseText,'success');}else retry(request.responseText||'Upload failed. Try again.');};
 request.onerror=()=>retry('Connection lost. Reconnect to device Wi-Fi and reload the page to check its version before retrying.');
 request.ontimeout=()=>retry('Upload timed out. Reconnect and reload the page before retrying.');
 request.send(image);
});
</script></body></html>
